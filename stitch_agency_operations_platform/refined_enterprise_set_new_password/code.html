<p class="text-muted font-body-sm text-body-sm text-center">Your new password must be at least 8 characters long.</p>

<!-- Input Group 1 -->
<div class="flex flex-col gap-sm">
<label class="text-deep-slate font-button text-button block" for="new_password">New Password</label>
<div class="relative">
<input class="w-full h-[52px] rounded-lg border border-slate-200 bg-surface-container-lowest px-md py-sm text-deep-slate placeholder-muted font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all" id="new_password" name="new_password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-muted hover:text-deep-slate focus:outline-none" type="button">
<span class="material-symbols-outlined" data-icon="visibility" data-weight="fill" style="font-variation-settings: 'FILL' 1;">visibility</span>
</button>
</div>
</div>
<!-- Input Group 2 -->
<div class="flex flex-col gap-sm">
<label class="text-deep-slate font-button text-button block" for="confirm_password">Confirm New Password</label>
<input class="w-full h-[52px] rounded-lg border border-slate-200 bg-surface-container-lowest px-md py-sm text-deep-slate placeholder-muted font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all" id="confirm_password" name="confirm_password" placeholder="••••••••" type="password"/>
</div>

<button class="w-full h-[52px] bg-primary-container text-on-primary font-button text-button rounded-lg hover:bg-[#4338CA] transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 flex items-center justify-center mt-lg rounded-lg" type="submit">
